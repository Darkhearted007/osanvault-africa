kind = "mobile"
previewPath = "/osanvault-mobile/"
title = "OsanVault Africa Mobile"
version = "1.0.0"
id = "artifacts/osanvault-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = ["/osanvault-mobile/"]
localPort = 25857

[services.development]
run = "pnpm --filter @workspace/osanvault-mobile run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/osanvault-mobile", "run", "build"]
run = "pnpm --filter @workspace/osanvault-mobile run serve"

[services.env]
PORT = "25857"
