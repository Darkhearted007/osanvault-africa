# ÒSÁNVAULT AFRICA - Hardened Nginx Configuration
# SECURITY: Rate limiting, CORS, security headers

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # SECURITY: Basic rate limiting
    limit_req zone=conn_limit burst=15 nodelay;

    # Health check endpoint (unlimited)
    location = /health {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        access_log off;
    }

    # API endpoints with rate limiting
    location /api {
        # Rate limit: 10 requests per second
        limit_req zone=api_limit burst=20 nodelay;
        # Stricter limit for auth endpoints
        location ~ ^/api/auth {
            limit_req zone=auth_limit burst=5 nodelay;
        }

        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # SECURITY: Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;
        
        # CORS headers for Solana dApps
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Wallet-Address" always;
        
        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Wallet-Address";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Frontend
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # SECURITY: Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mainnet-beta.solana.com https://api.devnet.solana.com" always;
        
        # Cache static assets
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # SECURITY: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }

    # SECURITY: Deny access to backup and config files
    location ~ /\.(env|sql|md|yml|yaml)$ {
        deny all;
    }

    # SECURITY: Rate limit exceeded
    error_page 429 = @rate_limited;
    location @rate_limited {
        return 429 '{"error": "Rate limit exceeded. Please try again later."}';
        add_header Content-Type application/json;
    }
}