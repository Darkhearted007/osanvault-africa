apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: osanvault
  labels:
    app: osanvault
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osanvault
      component: postgres
  template:
    metadata:
      labels:
        app: osanvault
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: osanvault
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osanvault-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: osanvault_db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: osanvault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: osanvault
spec:
  selector:
    app: osanvault
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres