apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osanvault-ingress
  namespace: osanvault
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - osanvaultafrica.com
        - www.osanvaultafrica.com
        - api.osanvaultafrica.com
      secretName: osanvault-tls
  rules:
    - host: osanvaultafrica.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.osanvaultafrica.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80