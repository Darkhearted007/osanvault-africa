apiVersion: v1
kind: Secret
metadata:
  name: osanvault-secrets
  namespace: osanvault
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/osanvault_db"
  redis-url: "redis://:password@redis:6379"
  jwt-secret: "REPLACE_WITH_SECURE_SECRET"
  queue-secret: "REPLACE_WITH_SECURE_SECRET"