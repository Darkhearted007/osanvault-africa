apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: osanvault
  labels:
    app: osanvault
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osanvault
      component: api
  template:
    metadata:
      labels:
        app: osanvault
        component: api
    spec:
      containers:
        - name: api
          image: osanvault/api:latest
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: osanvault-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: osanvault-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: osanvault-secrets
                  key: jwt-secret
            - name: QUEUE_SECRET
              valueFrom:
                secretKeyRef:
                  name: osanvault-secrets
                  key: queue-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: osanvault
spec:
  selector:
    app: osanvault
    component: api
  ports:
    - port: 80
      targetPort: 3001
      name: http