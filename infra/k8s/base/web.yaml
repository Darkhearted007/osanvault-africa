apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: osanvault
  labels:
    app: osanvault
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osanvault
      component: web
  template:
    metadata:
      labels:
        app: osanvault
        component: web
    spec:
      containers:
        - name: web
          image: osanvault/web:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: osanvault
spec:
  selector:
    app: osanvault
    component: web
  ports:
    - port: 80
      targetPort: 80
      name: http