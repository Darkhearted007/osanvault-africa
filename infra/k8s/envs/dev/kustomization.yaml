apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: osanvault

resources:
  - ../base/namespace.yaml
  - ../base/secrets.yaml
  - ../base/postgres.yaml
  - ../base/redis.yaml
  - ../base/api.yaml
  - ../base/web.yaml
  - ../base/hpa.yaml

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: api-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: web-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - CORS_ORIGIN=http://localhost:5173