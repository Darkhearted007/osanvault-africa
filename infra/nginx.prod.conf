# ÒsánVault Africa - Production Nginx Configuration
# Hardened for production with TLS, security headers, caching

# Upstream definitions
upstream api_backend {
    least_conn;
    server 127.0.0.1:3001 weight=5;
    keepalive 32;
}

upstream web_backend {
    server 127.0.0.1:5173;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Cache zones
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=500m inactive=24h use_temp_path=off;

# Security: Block common exploits
map $http_user_agent $bad_bot {
    default 0;
    ~*(SemrushBot|MJ12bot|AhrefsBot|Screaming Frog) 1;
    ~*(curl|wget|python|scrapy) 1;
}

# Main server - redirect to HTTPS
server {
    listen 80;
    server_name osanvaultafrica.com www.osanvaultafrica.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name osanvaultafrica.com www.osanvaultafrica.com;

    # SSL Configuration - UPDATE THESE
    ssl_certificate /etc/ssl/certs/osanvault.crt;
    ssl_certificate_key /etc/ssl/private/osanvault.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mainnet-beta.solana.com https://api.devnet.solana.com wss://api.mainnet-beta.solana.com; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }

    # Rate limiting
    limit_req zone=conn_limit burst=20 nodelay;

    # Health check - no rate limit
    location = /health {
        proxy_pass http://api_backend;
        access_log off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Nginx health check
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # API endpoints with rate limiting
    location /api {
        limit_req zone=api_limit burst=30 nodelay;

        # Stricter limits for auth
        location ~ ^/api/auth {
            limit_req zone=auth_limit burst=10 nodelay;
        }

        # Stricter limits for uploads
        location ~ ^/api/upload {
            limit_req zone=upload_limit burst=5 nodelay;
        }

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # CORS for Solana dApps
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Wallet-Address, X-Request-ID" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Wallet-Address, X-Request-ID";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # Cache GET responses
        if ($request_method = GET) {
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    # Static assets with long cache
    location /assets {
        proxy_pass http://web_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Frontend SPA - all non-API routes
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_uptry;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache HTML for 5 minutes
        location = / {
            proxy_cache static_cache;
            proxy_cache_valid 200 5m;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Rate limit exceeded handler
    error_page 429 = @rate_limited;
    location @rate_limited {
        return 429 '{"error": "Rate limit exceeded. Please try again later.", "retry_after": 60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Deny access to config files
    location ~ /\.(env|sql|md|yml|yaml|json)$ {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/osanvault_access.log combined;
    error_log /var/log/nginx/osanvault_error.log warn;
}