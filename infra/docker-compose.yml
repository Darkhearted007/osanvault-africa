version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: osanvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: osanvault
      POSTGRES_PASSWORD: osanvault_dev
      POSTGRES_DB: osanvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osanvault -d osanvault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osanvault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
