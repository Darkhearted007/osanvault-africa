openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: OsanVault Africa API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Tokenized property SPVs
  - name: carbon
    description: Carbon credit projects
  - name: governance
    description: Governance proposals
  - name: activity
    description: Platform activity feed
  - name: stats
    description: Platform statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /carbon-projects:
    get:
      operationId: listCarbonProjects
      tags: [carbon]
      summary: List all carbon projects
      responses:
        "200":
          description: List of carbon projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarbonProject"

  /governance-proposals:
    get:
      operationId: listGovernanceProposals
      tags: [governance]
      summary: List all governance proposals
      responses:
        "200":
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernanceProposal"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Recent platform activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /platform-stats:
    get:
      operationId: getPlatformStats
      tags: [stats]
      summary: Platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Property:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        location:
          type: string
        country:
          type: string
        flag:
          type: string
        targetRaise:
          type: number
        raised:
          type: number
        totalTokens:
          type: integer
        tokenPrice:
          type: integer
        yieldApy:
          type: number
        size:
          type: string
        status:
          type: string
        carbonOffsetTonnes:
          type: integer
        description:
          type: string
        gradientFrom:
          type: string
        gradientTo:
          type: string
        jurisdiction:
          type: string
        indigenousAuthority:
          type: string
        legalDocCid:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - location
        - country
        - flag
        - targetRaise
        - raised
        - totalTokens
        - tokenPrice
        - yieldApy
        - size
        - status
        - carbonOffsetTonnes
        - description
        - gradientFrom
        - gradientTo
        - jurisdiction
        - indigenousAuthority
        - legalDocCid
        - lat
        - lng
        - createdAt
        - updatedAt

    CarbonProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        methodology:
          type: string
        region:
          type: string
        vintage:
          type: integer
        totalIssued:
          type: string
        totalRetired:
          type: string
        verified:
          type: boolean
        verifier:
          type: string
        flag:
          type: string
        description:
          type: string
        lat:
          type: number
        lng:
          type: number
        registryLink:
          type: string
        linkedPropertyId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - methodology
        - region
        - vintage
        - totalIssued
        - totalRetired
        - verified
        - verifier
        - flag
        - description
        - lat
        - lng
        - registryLink
        - createdAt

    GovernanceProposal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        proposer:
          type: string
        status:
          type: string
        votesFor:
          type: number
        votesAgainst:
          type: number
        quorum:
          type: number
        endTime:
          type: string
          format: date-time
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - proposer
        - status
        - votesFor
        - votesAgainst
        - quorum
        - endTime
        - category
        - createdAt

    ActivityEvent:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        propertyId:
          type: integer
          nullable: true
        propertyName:
          type: string
          nullable: true
        projectId:
          type: integer
          nullable: true
        projectName:
          type: string
          nullable: true
        amount:
          type: string
        amountNgn:
          type: integer
          nullable: true
        address:
          type: string
        txHash:
          type: string
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - amount
        - address
        - txHash
        - timestamp
        - createdAt

    PlatformStats:
      type: object
      properties:
        propertiesLive:
          type: integer
        tvlNgn:
          type: number
        totalInvestors:
          type: integer
        osanvStaked:
          type: number
        totalCarbonTonnes:
          type: integer
        avgPropertyYield:
          type: number
      required:
        - propertiesLive
        - tvlNgn
        - totalInvestors
        - osanvStaked
        - totalCarbonTonnes
        - avgPropertyYield

