name: Anchor Contracts CI

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: burgossrodrigo/anchor-build:0.30.1

    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup

    steps:
      - uses: actions/checkout@v4

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            programs/*/target
            .anchor
          key: ${{ runner.os }}-anchor-${{ hashFiles('programs/*/Cargo.lock', 'Anchor.toml') }}
          restore-keys: |
            ${{ runner.os }}-anchor-

      - name: Generate keypair
        run: |
          mkdir -p $HOME/.config/solana
          solana-keygen new \
            --outfile $HOME/.config/solana/id.json \
            --no-bip39-passphrase --force

      - name: Fix blake3 compatibility
        run: cargo update -p blake3 --precise 1.8.2
        working-directory: programs/osanvault_core

      - name: Fix indexmap compatibility
        run: cargo update -p indexmap --precise 2.11.4
        working-directory: programs/osanvault_core

      - name: Build programs
        run: anchor build
        working-directory: .

      - name: Run tests
        run: anchor test
        working-directory: .

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-logs
          path: |
            programs/*/target
            .anchor/program-logs
