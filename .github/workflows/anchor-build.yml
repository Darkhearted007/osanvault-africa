name: Anchor Contracts Build

on:
  push:
    branches: [main, dev]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor-build.yml'
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to deploy (devnet/mainnet)'
        required: false
        default: 'devnet'

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTUP_HOME: ${{ github.workspace }}/.rustup

jobs:
  build-contracts:
    name: Build Solana Programs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: rust-lang/actions/setup@v2
        with:
          version: stable

      - name: Install Solana CLI
        run: |
          echo "=== Installing Solana CLI ==="
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.26/install.sh)"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "=== Solana installed ==="
        shell: bash

      - name: Verify installations
        run: |
          echo "=== Checking installations ==="
          echo "Rust:"
          rustc --version
          cargo --version
          echo ""
          echo "Solana:"
          solana-install --version
          echo ""
          echo "SBF target:"
          rustup target list --installed
          echo ""
          echo "Installing SBF target..."
          rustup target add sbf
          rustup target list --installed
        shell: bash

      - name: Install Node.js and Anchor CLI
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install and verify Anchor CLI
        run: |
          echo "=== Installing Anchor CLI ==="
          npm install -g @coral-xyz/anchor@1.0.2
          echo ""
          echo "=== Verifying Anchor ==="
          anchor --version 2>&1 || echo "Anchor not found in PATH"
          which anchor || echo "anchor binary not in PATH"
          ls -la $(npm root -g)/@coral-xyz/anchor/cli/anchor 2>&1 || echo "Anchor CLI not found"
        shell: bash

      - name: Build with Anchor
        run: |
          echo "=== Building with Anchor ==="
          echo "Current directory: $(pwd)"
          echo "Anchor.toml exists: $(test -f Anchor.toml && echo yes || echo no)"
          echo "Programs directory:"
          ls -la programs/
          echo ""
          anchor build 2>&1
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          RUST_BACKTRACE: "1"

      - name: Generate build report
        if: success()
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Program | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|------|" >> $GITHUB_STEP_SUMMARY
          for prog in osanvault_core osanvault_lend reits minerals carbon landbank oracle; do
            sofile=""
            for path in ".anchor/localnet/$prog.so" "target/deploy/$prog.so" "programs/$prog/target/deploy/$prog.so"; do
              if [ -f "$path" ]; then
                sofile="$path"
                break
              fi
            done
            if [ -n "$sofile" ]; then
              size=$(wc -c < "$sofile" 2>/dev/null || echo "0")
              echo "| $prog | :white_check_mark: Built | ${size} bytes |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $prog | :x: FAILED | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la .anchor/ 2>/dev/null || echo "No .anchor directory" >> $GITHUB_STEP_SUMMARY
          ls -la target/deploy/ 2>/dev/null || echo "No target/deploy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: solana-programs-build-${{ github.run_number }}
          path: |
            .anchor/
            target/
          retention-days: 7

  lint-rust:
    name: Lint Rust Code
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: rust-lang/actions/setup@v2
        with:
          version: stable
          components: rustfmt, clippy

      - name: Run rustfmt
        run: |
          for prog in programs/*/Cargo.toml; do
            echo "Checking format for $prog..."
            cargo fmt --check --manifest-path="$prog" 2>&1 || true
          done
        shell: bash
        continue-on-error: true

      - name: Run clippy
        run: |
          for prog in programs/*/Cargo.toml; do
            echo "Linting $prog..."
            cargo clippy --manifest-path="$prog" -- -D warnings 2>&1 || true
          done
        shell: bash
        continue-on-error: true

  verify-program-ids:
    name: Verify Program IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify IDs match
        run: |
          echo "## Program ID Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Anchor.toml Program IDs" >> $GITHUB_STEP_SUMMARY
          grep -E "^\s*[a-z_]+ = \"" Anchor.toml >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### declare_id! in source" >> $GITHUB_STEP_SUMMARY
          grep -rh "declare_id!" programs/*/src/lib.rs | sort | uniq >> $GITHUB_STEP_SUMMARY
        shell: bash