version: '3.8'

services:
  solana-validator:
    image: solanalabs/solana:v1.18.26
    container_name: osanvault-validator
    ports:
      - "8899:8899"
      - "8900:8900"
      - "8000:8000/udp"
      - "8001:8001/udp"
      - "8002:8002/udp"
    volumes:
      - solana-ledger:/usr/bin/config/ledger
      - solana-config:/usr/bin/config
      - ./programs:/workspace/programs
      - ./Anchor.toml:/workspace/Anchor.toml
    environment:
      - RUST_LOG=info
    entrypoint: bash
    command: >
      -c "solana-test-validator --ledger /usr/bin/config/ledger --rpc-port 8899 --faucet-port 9900 --log"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  anchor-builder:
    image: solanalabs/solana:v1.18.26
    container_name: osanvault-builder
    depends_on:
      solana-validator:
        condition: service_healthy
    volumes:
      - ./programs:/workspace/programs
      - ./Anchor.toml:/workspace/Anchor.toml
      - anchor-cargo:/root/.cargo
      - anchor-target:/workspace/target
    environment:
      - RUST_LOG=info
      - SOLANA_REMOTE_RPC_URL=http://solana-validator:8899
    entrypoint: bash
    command: >
      -c "curl -fsSL https://github.com/solana-foundation/anchor/releases/download/v1.0.2/anchor-1.0.2-x86_64-unknown-linux-gnu -o /usr/local/bin/anchor && chmod +x /usr/local/bin/anchor && tail -f /dev/null"
    stdin_open: true
    tty: true

volumes:
  solana-ledger:
  solana-config:
  anchor-cargo:
  anchor-target:
